<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ärztin im klinischen Alltag">
  <title>Ärztin im klinischen Alltag</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f4fd"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#dde5ee"/>
    </linearGradient>
  </defs>

  <!-- Background / wall -->
  <rect width="800" height="560" fill="url(#bg2)"/>

  <!-- Floor -->
  <rect x="0" y="380" width="800" height="180" fill="url(#floor2)"/>
  <!-- Floor tiles subtle lines -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#ccd8e4" stroke-width="1"/>
  <line x1="200" y1="380" x2="200" y2="560" stroke="#ccd8e4" stroke-width="0.5" opacity="0.5"/>
  <line x1="400" y1="380" x2="400" y2="560" stroke="#ccd8e4" stroke-width="0.5" opacity="0.5"/>
  <line x1="600" y1="380" x2="600" y2="560" stroke="#ccd8e4" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#ccd8e4" stroke-width="0.5" opacity="0.5"/>

  <!-- Large windows on the right wall -->
  <rect x="540" y="30" width="220" height="330" rx="4" fill="#c8dff0"/>
  <rect x="540" y="30" width="220" height="330" rx="4" fill="none" stroke="#a0c0d8" stroke-width="3"/>
  <line x1="650" y1="30" x2="650" y2="360" stroke="#a0c0d8" stroke-width="2"/>
  <line x1="540" y1="190" x2="760" y2="190" stroke="#a0c0d8" stroke-width="2"/>
  <!-- Bright daylight through window -->
  <rect x="543" y="33" width="104" height="154" rx="2" fill="#d8ecf8"/>
  <rect x="653" y="33" width="104" height="154" rx="2" fill="#d0e8f8"/>
  <rect x="543" y="193" width="104" height="134" rx="2" fill="#d8ecf8"/>
  <rect x="653" y="193" width="104" height="134" rx="2" fill="#d0e8f8"/>

  <!-- Hospital door on left -->
  <rect x="40" y="120" width="100" height="260" rx="4" fill="#d4dce8"/>
  <rect x="40" y="120" width="100" height="260" rx="4" fill="none" stroke="#a0b0c4" stroke-width="2"/>
  <rect x="42" y="122" width="96" height="256" rx="3" fill="#dce4f0"/>
  <circle cx="132" cy="252" r="6" fill="#8a9ab0"/>
  <rect x="44" y="124" width="92" height="120" rx="2" fill="#c8d4e4" opacity="0.3"/>

  <!-- Medical cabinet / wall unit -->
  <rect x="160" y="60" width="120" height="300" rx="4" fill="#e0e8f0"/>
  <rect x="160" y="60" width="120" height="300" rx="4" fill="none" stroke="#b0c0d4" stroke-width="1.5"/>
  <!-- Cabinet shelves with medical items -->
  <rect x="162" y="140" width="116" height="2" fill="#b0c0d4"/>
  <rect x="162" y="220" width="116" height="2" fill="#b0c0d4"/>
  <rect x="162" y="300" width="116" height="2" fill="#b0c0d4"/>
  <!-- Binders/folders on shelves -->
  <rect x="168" y="70" width="18" height="68" rx="2" fill="#1261a6"/>
  <rect x="189" y="70" width="14" height="68" rx="2" fill="#3a8fd1"/>
  <rect x="206" y="70" width="18" height="68" rx="2" fill="#0b2341"/>
  <rect x="227" y="70" width="16" height="68" rx="2" fill="#5c6f82"/>
  <rect x="246" y="70" width="22" height="68" rx="2" fill="#1261a6"/>
  <!-- Medical supplies on middle shelf -->
  <rect x="168" y="150" width="26" height="40" rx="3" fill="white" stroke="#d9e5ef" stroke-width="1"/>
  <rect x="171" y="153" width="20" height="18" rx="2" fill="#e0f0ff"/>
  <rect x="200" y="150" width="22" height="38" rx="3" fill="#1261a6" opacity="0.8"/>
  <rect x="226" y="154" width="16" height="34" rx="3" fill="#e8f4fc"/>
  <rect x="228" y="156" width="12" height="10" rx="1" fill="#1261a6" opacity="0.5"/>
  <rect x="248" y="150" width="24" height="40" rx="3" fill="white" stroke="#d9e5ef" stroke-width="1"/>
  <!-- Red cross on white box -->
  <rect x="256" y="162" width="8" height="16" rx="1" fill="#cc3333"/>
  <rect x="252" y="167" width="16" height="6" rx="1" fill="#cc3333"/>
  <!-- Bottom shelf: specimen jars -->
  <ellipse cx="180" cy="282" rx="14" ry="16" fill="#e8f4fc" stroke="#a0c4e0" stroke-width="1"/>
  <ellipse cx="180" cy="272" rx="14" ry="6" fill="#c8ddf0"/>
  <ellipse cx="210" cy="285" rx="12" ry="13" fill="#e8f4fc" stroke="#a0c4e0" stroke-width="1"/>
  <ellipse cx="240" cy="283" rx="14" ry="15" fill="#e0f0e8" stroke="#90c0a0" stroke-width="1"/>
  <ellipse cx="240" cy="274" rx="14" ry="6" fill="#b8d8c0"/>

  <!-- Doctor's desk / workstation -->
  <rect x="300" y="330" width="260" height="52" rx="4" fill="#c8d4e0"/>
  <rect x="300" y="338" width="260" height="8" rx="2" fill="#b0bece"/>
  <!-- Desk legs -->
  <rect x="310" y="382" width="16" height="60" rx="3" fill="#a8b8c8"/>
  <rect x="534" y="382" width="16" height="60" rx="3" fill="#a8b8c8"/>

  <!-- Computer monitor on desk -->
  <rect x="350" y="240" width="160" height="94" rx="6" fill="#1a1a2e"/>
  <rect x="354" y="244" width="152" height="86" rx="4" fill="#0a2040"/>
  <!-- Screen content: patient chart / EHR -->
  <rect x="357" y="247" width="146" height="12" rx="2" fill="#1261a6" opacity="0.8"/>
  <rect x="360" y="250" width="80" height="6" rx="1" fill="white" opacity="0.8"/>
  <!-- Graph line -->
  <polyline points="360,276 374,268 388,280 402,264 416,272 430,258 444,266 458,260 472,270 486,255 500,263" fill="none" stroke="#3a8fd1" stroke-width="2"/>
  <!-- Data grid lines -->
  <line x1="360" y1="264" x2="500" y2="264" stroke="#1a4080" stroke-width="0.5"/>
  <line x1="360" y1="278" x2="500" y2="278" stroke="#1a4080" stroke-width="0.5"/>
  <line x1="360" y1="292" x2="500" y2="292" stroke="#1a4080" stroke-width="0.5"/>
  <!-- Text rows at bottom -->
  <rect x="360" y="298" width="90" height="3" rx="1" fill="#3a8fd1" opacity="0.5"/>
  <rect x="360" y="304" width="70" height="3" rx="1" fill="#3a8fd1" opacity="0.3"/>
  <rect x="360" y="310" width="80" height="3" rx="1" fill="#3a8fd1" opacity="0.5"/>
  <rect x="360" y="316" width="60" height="3" rx="1" fill="#3a8fd1" opacity="0.3"/>
  <!-- Monitor stand -->
  <rect x="415" y="334" width="30" height="6" rx="2" fill="#1a1a2e"/>
  <rect x="402" y="338" width="56" height="4" rx="2" fill="#1a1a2e"/>

  <!-- Keyboard and mouse -->
  <rect x="340" y="344" width="160" height="24" rx="4" fill="#2a2a3e"/>
  <rect x="344" y="348" width="152" height="16" rx="2" fill="#222232"/>
  <circle cx="540" cy="352" r="10" fill="#2a2a3e"/>
  <ellipse cx="540" cy="352" rx="7" ry="9" fill="#222232"/>

  <!-- DOCTOR FIGURE -->
  <!-- Standing, looking at clipboard -->

  <!-- Shoes -->
  <ellipse cx="412" cy="502" rx="22" ry="8" fill="#1a1a2e"/>
  <ellipse cx="458" cy="502" rx="22" ry="8" fill="#1a1a2e"/>

  <!-- Legs (scrubs/trousers) -->
  <rect x="393" y="420" width="38" height="84" rx="8" fill="#4a6080"/>
  <rect x="437" y="420" width="38" height="84" rx="8" fill="#4a6080"/>

  <!-- White coat (body) -->
  <rect x="375" y="270" width="120" height="158" rx="14" fill="white"/>
  <!-- Coat lapels -->
  <polygon points="395,270 380,310 375,270" fill="#e8ecf0"/>
  <polygon points="475,270 490,310 495,270" fill="#e8ecf0"/>
  <!-- Scrubs/shirt underneath -->
  <rect x="398" y="270" width="74" height="155" rx="8" fill="#4a8fc0"/>
  <!-- Coat pocket -->
  <rect x="380" y="340" width="36" height="40" rx="3" fill="#f0f4f8"/>
  <rect x="382" y="342" width="32" height="2" rx="1" fill="#ccd4e0"/>
  <!-- Pen in pocket -->
  <rect x="390" y="340" width="4" height="20" rx="2" fill="#1261a6"/>
  <rect x="396" y="340" width="4" height="20" rx="2" fill="#0b2341"/>
  <!-- Stethoscope -->
  <path d="M430 290 Q450 280 455 300 Q460 320 440 330 Q420 340 410 320 Q400 300 420 290" fill="none" stroke="#1261a6" stroke-width="4" stroke-linecap="round"/>
  <!-- Stethoscope chest piece -->
  <circle cx="408" cy="323" r="8" fill="#0b2341"/>
  <circle cx="408" cy="323" r="5" fill="#1261a6"/>

  <!-- Neck -->
  <rect x="415" y="252" width="40" height="22" rx="10" fill="#e0c4a0"/>

  <!-- Head -->
  <ellipse cx="435" cy="228" rx="40" ry="44" fill="#f0d0b0"/>

  <!-- Hair (professional short) -->
  <ellipse cx="435" cy="200" rx="40" ry="28" fill="#2a1808"/>
  <ellipse cx="435" cy="194" rx="36" ry="18" fill="#3a2010"/>
  <ellipse cx="409" cy="222" rx="14" ry="20" fill="#2a1808"/>
  <ellipse cx="461" cy="222" rx="14" ry="20" fill="#2a1808"/>

  <!-- Ears -->
  <ellipse cx="396" cy="232" rx="7" ry="9" fill="#e0c4a0"/>
  <ellipse cx="474" cy="232" rx="7" ry="9" fill="#e0c4a0"/>

  <!-- Face - focused expression looking at clipboard -->
  <ellipse cx="422" cy="238" rx="5.5" ry="6" fill="#1a0a00"/>
  <ellipse cx="448" cy="238" rx="5.5" ry="6" fill="#1a0a00"/>
  <path d="M424 254 Q435 259 446 254" fill="none" stroke="#c4906a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyebrows - slight concentration -->
  <path d="M416 228 Q422 224 428 227" fill="none" stroke="#2a1808" stroke-width="2" stroke-linecap="round"/>
  <path d="M442 227 Q448 224 454 228" fill="none" stroke="#2a1808" stroke-width="2" stroke-linecap="round"/>

  <!-- Left arm holding clipboard -->
  <rect x="365" y="295" width="52" height="28" rx="12" fill="#e0c4a0" transform="rotate(15 391 309)"/>
  <ellipse cx="358" cy="330" rx="16" ry="13" fill="#e0c4a0"/>
  <!-- Right arm extended -->
  <rect x="495" y="295" width="50" height="26" rx="12" fill="#e0c4a0" transform="rotate(-10 520 308)"/>
  <ellipse cx="544" cy="316" rx="15" ry="13" fill="#e0c4a0"/>

  <!-- Clipboard held by left hand -->
  <rect x="300" y="302" width="70" height="90" rx="4" fill="#c8a060"/>
  <rect x="304" y="306" width="62" height="82" rx="3" fill="#f5f5f0"/>
  <!-- Clipboard content -->
  <rect x="330" y="295" width="24" height="14" rx="4" fill="#c8a060"/>
  <rect x="308" y="310" width="54" height="4" rx="1" fill="#0b2341" opacity="0.4"/>
  <rect x="308" y="318" width="48" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <rect x="308" y="325" width="52" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <rect x="308" y="332" width="44" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <!-- Red cross on clipboard header -->
  <rect x="308" y="310" width="54" height="14" rx="2" fill="#cc2222" opacity="0.15"/>
  <!-- Checkboxes on form -->
  <rect x="308" y="342" width="8" height="8" rx="1" fill="none" stroke="#0b2341" stroke-width="1" opacity="0.5"/>
  <polyline points="309,346 311,349 315,343" fill="none" stroke="#1261a6" stroke-width="1.5" opacity="0.8"/>
  <rect x="308" y="354" width="8" height="8" rx="1" fill="none" stroke="#0b2341" stroke-width="1" opacity="0.5"/>
  <rect x="308" y="366" width="8" height="8" rx="1" fill="none" stroke="#0b2341" stroke-width="1" opacity="0.5"/>
  <rect x="320" y="344" width="30" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <rect x="320" y="356" width="36" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <rect x="320" y="368" width="28" height="3" rx="1" fill="#0b2341" opacity="0.3"/>

  <!-- Name badge on coat -->
  <rect x="460" y="320" width="50" height="28" rx="3" fill="white" stroke="#d9e5ef" stroke-width="1"/>
  <rect x="462" y="323" width="30" height="4" rx="1" fill="#1261a6" opacity="0.7"/>
  <rect x="462" y="330" width="22" height="3" rx="1" fill="#5c6f82" opacity="0.5"/>
  <rect x="462" y="336" width="36" height="3" rx="1" fill="#5c6f82" opacity="0.4"/>

  <!-- Medical supplies on desk -->
  <rect x="575" y="310" width="20" height="22" rx="3" fill="white" stroke="#d9e5ef" stroke-width="1"/>
  <rect x="577" y="313" width="16" height="8" rx="1" fill="#e0f0ff"/>
  <circle cx="585" cy="330" r="4" fill="#1261a6" opacity="0.4"/>
  <!-- Stethoscope on desk -->
  <path d="M610 316 Q625 310 630 320 Q635 330 622 335" fill="none" stroke="#0b2341" stroke-width="3" stroke-linecap="round"/>
  <circle cx="621" cy="337" r="5" fill="#0b2341"/>

  <!-- Subtle hospital ceiling light -->
  <rect x="280" y="0" width="240" height="12" rx="4" fill="#e0ecf8"/>
  <rect x="286" y="4" width="228" height="6" rx="2" fill="#f0f8ff" opacity="0.9"/>
  <!-- Light spread -->
  <polygon points="280,12 160,380 640,380 520,12" fill="#ffffff" opacity="0.06"/>

</svg>

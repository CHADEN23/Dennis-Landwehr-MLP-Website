  <rect x="654" y="314" width="102" height="72" rx="4" fill="#d8e4f0"/>
  <!-- Tray on top -->
  <rect x="646" y="302" width="118" height="12" rx="4" fill="#b0c0d0"/>
  <!-- Instruments on tray -->
  <rect x="652" y="285" width="40" height="4" rx="2" fill="#c0c8d0"/>
  <rect x="696" y="283" width="32" height="4" rx="2" fill="#c0c8d0"/>
  <rect x="732" y="285" width="26" height="4" rx="2" fill="#c0c8d0"/>
  <circle cx="690" cy="287" r="3" fill="#a0a8b0"/>
  <circle cx="726" cy="285" r="3" fill="#a0a8b0"/>
  <!-- Small containers on tray -->
  <rect x="656" y="318" width="24" height="28" rx="3" fill="white" opacity="0.9"/>
  <rect x="658" y="320" width="20" height="10" rx="1" fill="#e0f0ff"/>
  <rect x="686" y="320" width="20" height="26" rx="3" fill="#1261a6" opacity="0.7"/>
  <rect x="712" y="322" width="18" height="24" rx="3" fill="white" opacity="0.9"/>
  <rect x="736" y="318" width="20" height="28" rx="3" fill="#cc3333" opacity="0.5"/>
  <!-- Cart wheels -->
  <circle cx="660" cy="390" r="8" fill="#8898a8"/>
  <circle cx="750" cy="390" r="8" fill="#8898a8"/>


  <rect x="358" y="68" width="72" height="8" rx="3" fill="#d0d8e0"/>
  <rect x="350" y="72" width="8" height="40" rx="3" fill="#d0d8e0" transform="rotate(20 354 92)"/>
  <!-- Lamp head -->
  <circle cx="335" cy="120" r="48" fill="#e8eef4"/>
  <circle cx="335" cy="120" r="44" fill="#dde5f0"/>
  <circle cx="335" cy="120" r="36" fill="#f0f8ff"/>
  <!-- LED array -->
  <circle cx="335" cy="120" r="28" fill="#e8f4ff"/>
  <circle cx="322" cy="110" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="335" cy="106" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="348" cy="110" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="316" cy="122" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="329" cy="118" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="341" cy="118" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="354" cy="122" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="322" cy="132" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="335" cy="134" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="348" cy="132" r="5" fill="#ffffff" opacity="0.9"/>

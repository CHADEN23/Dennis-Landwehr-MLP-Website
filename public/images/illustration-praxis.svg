  <path d="M393 302 Q398 305 403 302" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M406 302 Q411 305 416 302" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth open slightly -->
  <path d="M395 312 Q402 316 409 312" fill="none" stroke="#c47050" stroke-width="1.5" stroke-linecap="round"/>


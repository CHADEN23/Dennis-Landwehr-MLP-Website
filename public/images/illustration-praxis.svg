<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Moderne Zahnarztpraxis mit Behandlungsstuhl">
  <title>Moderne Zahnarztpraxis</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5fc"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f2fc"/>
      <stop offset="100%" stop-color="#c8ddf0"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4eaf2"/>
      <stop offset="100%" stop-color="#d8e2ee"/>
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="560" fill="url(#bg3)"/>

  <!-- Floor -->
  <rect x="0" y="390" width="800" height="170" fill="url(#floor3)"/>
  <!-- Floor tile lines -->
  <line x1="0" y1="390" x2="800" y2="390" stroke="#c0ccda" stroke-width="1.5"/>
  <line x1="200" y1="390" x2="200" y2="560" stroke="#c0ccda" stroke-width="0.5" opacity="0.6"/>
  <line x1="400" y1="390" x2="400" y2="560" stroke="#c0ccda" stroke-width="0.5" opacity="0.6"/>
  <line x1="600" y1="390" x2="600" y2="560" stroke="#c0ccda" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="475" x2="800" y2="475" stroke="#c0ccda" stroke-width="0.5" opacity="0.6"/>

  <!-- Accent wall section behind chair (darker, feature wall) -->
  <rect x="160" y="0" width="480" height="390" fill="#1261a6" opacity="0.06"/>
  <rect x="160" y="0" width="5" height="390" fill="#1261a6" opacity="0.15"/>
  <rect x="635" y="0" width="5" height="390" fill="#1261a6" opacity="0.15"/>

  <!-- Ceiling light rails (modern) -->
  <rect x="0" y="0" width="800" height="14" fill="#e0eaf4"/>
  <rect x="200" y="0" width="400" height="14" rx="0" fill="#d0dff0"/>

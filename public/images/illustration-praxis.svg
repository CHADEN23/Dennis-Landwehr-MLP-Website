  <rect x="314" y="24" width="172" height="28" rx="3" fill="#0b2341" opacity="0.05"/>
  <rect x="318" y="29" width="90" height="5" rx="2" fill="#1261a6" opacity="0.4"/>
  <rect x="318" y="37" width="70" height="4" rx="2" fill="#0b2341" opacity="0.25"/>
  <!-- Red cross logo -->
  <rect x="424" y="27" width="8" height="20" rx="1" fill="#cc2222" opacity="0.5"/>
  <rect x="418" y="33" width="20" height="8" rx="1" fill="#cc2222" opacity="0.5"/>

  <!-- Small plants in corners -->
  <rect x="740" y="342" width="14" height="50" rx="3" fill="#7a5a30"/>
  <ellipse cx="747" cy="328" rx="24" ry="22" fill="#3a8a3a"/>
  <ellipse cx="733" cy="338" rx="16" ry="14" fill="#2a7a2a"/>
  <ellipse cx="762" cy="336" rx="16" ry="14" fill="#4a9a4a"/>
  <ellipse cx="747" cy="322" rx="14" ry="12" fill="#5aaa5a"/>

  <rect x="42" y="350" width="12" height="44" rx="3" fill="#7a5a30"/>
  <ellipse cx="48" cy="338" rx="20" ry="18" fill="#4a9a4a"/>
  <ellipse cx="35" cy="346" rx="14" ry="12" fill="#3a8a3a"/>
  <ellipse cx="62" cy="344" rx="14" ry="12" fill="#5aaa5a"/>


  <rect x="580" y="90" width="70" height="8" rx="2" fill="#d0d8e0"/>
  <rect x="560" y="94" width="100" height="80" rx="6" fill="#1a1a2e"/>
  <rect x="563" y="97" width="94" height="74" rx="4" fill="#0a2040"/>

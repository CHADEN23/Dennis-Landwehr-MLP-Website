  <rect x="200" y="320" width="220" height="50" rx="12" fill="none" stroke="#a0c0d8" stroke-width="1.5"/>
  <!-- Seat cushion detail -->
  <rect x="204" y="324" width="212" height="42" rx="10" fill="#d4e8f8" opacity="0.5"/>
  <!-- Headrest -->
  <rect x="370" y="295" width="70" height="32" rx="10" fill="url(#chair)"/>
  <rect x="370" y="295" width="70" height="32" rx="10" fill="none" stroke="#a0c0d8" stroke-width="1.5"/>
  <rect x="373" y="299" width="64" height="24" rx="8" fill="#d4e8f8" opacity="0.5"/>
  <!-- Chair back -->
  <rect x="380" y="240" width="60" height="82" rx="12" fill="url(#chair)"/>
  <rect x="380" y="240" width="60" height="82" rx="12" fill="none" stroke="#a0c0d8" stroke-width="1.5"/>

  <rect x="678" y="62" width="64" height="5" rx="2" fill="#1261a6" opacity="0.4"/>
  <rect x="682" y="70" width="56" height="3" rx="1" fill="#0b2341" opacity="0.3"/>
  <rect x="686" y="76" width="48" height="3" rx="1" fill="#0b2341" opacity="0.25"/>
  <circle cx="710" cy="96" r="10" fill="none" stroke="#c8a820" stroke-width="2"/>
  <circle cx="710" cy="96" r="6" fill="#c8a820" opacity="0.3"/>

  <!-- Logo/name plate on wall -->

  <rect x="582" y="222" width="20" height="12" rx="5" fill="none" stroke="#60a0c0" stroke-width="1.5"/>
  <line x1="578" y1="228" x2="582" y2="228" stroke="#60a0c0" stroke-width="1.5"/>
  <line x1="545" y1="226" x2="558" y2="224" stroke="#60a0c0" stroke-width="1.5"/>
  <line x1="602" y1="224" x2="616" y2="226" stroke="#60a0c0" stroke-width="1.5"/>

  <!-- Dentist arms - working on patient -->
  <!-- Left arm extended toward patient -->
  <rect x="488" y="300" width="50" height="24" rx="12" fill="#e8c4a0" transform="rotate(-15 513 312)"/>
  <ellipse cx="482" cy="320" rx="14" ry="12" fill="#e8c4a0"/>
  <!-- Dental instrument in hand -->
  <rect x="440" y="315" width="46" height="4" rx="2" fill="#c0c8d0" transform="rotate(-20 463 317)"/>
  <circle cx="437" cy="320" r="5" fill="#a0a8b0"/>
  <!-- Right arm -->

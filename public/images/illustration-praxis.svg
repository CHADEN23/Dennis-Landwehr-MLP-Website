  <ellipse cx="586" cy="128" rx="8" ry="10" fill="#2a4070"/>
  <rect x="612" y="100" width="42" height="68" rx="2" fill="#0a1828"/>
  <ellipse cx="633" cy="126" rx="12" ry="16" fill="#1a3050" stroke="#2a5080" stroke-width="1"/>
  <ellipse cx="633" cy="126" rx="7" ry="9" fill="#2a4070"/>
  <!-- Small text below screens -->
  <rect x="564" y="175" width="88" height="3" rx="1" fill="#1261a6" opacity="0.5"/>


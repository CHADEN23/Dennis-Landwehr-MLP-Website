  <!-- Abstract nature art: circles and curves -->
  <circle cx="65" cy="85" rx="18" fill="#5aaa5a" opacity="0.4"/>
  <circle cx="95" cy="75" rx="14" fill="#4a9a6a" opacity="0.5"/>
  <circle cx="115" cy="100" rx="20" fill="#3a8a5a" opacity="0.3"/>
  <path d="M40 115 Q70 90 100 115 Q130 90 145 110" fill="none" stroke="#3a8a5a" stroke-width="2" opacity="0.5"/>

  <rect x="660" y="50" width="100" height="80" rx="4" fill="white" stroke="#c0ccd8" stroke-width="1.5"/>
  <rect x="664" y="54" width="92" height="72" rx="3" fill="#e8f4fc"/>
  <!-- Diploma/certificate -->
